name: Flutter Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # الأمر المعدل: يجبر الاسم على mn_doc
      - name: Create Android project files
        run: flutter create --platforms=android --project-name mn_doc .

      # مكتبة flutter_doc_scanner (عبر play-services-mlkit-document-scanner)
      # تتطلب minSdkVersion 23 كحد أدنى — نرفعها هنا لأن android/app/build.gradle
      # يُعاد توليده تلقائياً بكل تشغيل، فأي تعديل يدوي عليه لا يثبت.
      - name: Patch minSdkVersion for ML Kit Document Scanner
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          grep -n "minSdkVersion" android/app/build.gradle

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk