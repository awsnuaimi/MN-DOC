name: mn_doc
description: A document scanner and editor app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  get_it: ^7.6.4
  go_router: ^13.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  image_picker: ^1.0.7
  path: ^1.8.3
  signature: ^5.4.0
  image: ^4.1.7
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  image_cropper: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf